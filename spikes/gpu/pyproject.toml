[project]
name = "spike-gpu"
version = "0.1.0"
description = "Spike F0-03: Python 3.12 con uv y GPU visible desde PyTorch y CTranslate2"
requires-python = "==3.12.*"
dependencies = [
    "torch>=2.7",
    "ctranslate2>=4.5",
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12>=9,<10",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
